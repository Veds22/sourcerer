[project]
name = "sourcerer"
version = "0.1.0"
description = "Personal assistant, exposed as MCP tools. v1: tested via Claude Desktop over stdio."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.4.7",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
 
[tool.hatch.build.targets.wheel]
packages = ["src"]